<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Claude Controller</title>
<style>
  :root {
    --bg: #0b0f14; --card: #141b24; --card2: #1b2430;
    --text: #e6edf3; --dim: #8b98a5; --line: #26313d;
    --green: #3fb950; --amber: #d29922; --red: #f85149; --blue: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Apple SD Gothic Neo', Roboto, sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  body.alert { animation: flash 1s ease-in-out infinite; }
  @keyframes flash {
    0%, 100% { box-shadow: inset 0 0 0 4px transparent; }
    50% { box-shadow: inset 0 0 0 4px var(--amber); }
  }

  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  header h1 { font-size: 17px; font-weight: 700; flex: 1; }
  #conn { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 5px; }
  #conn::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; }
  #conn.on::before { background: var(--green); }

  .empty { color: var(--dim); text-align: center; padding: 48px 0 24px; font-size: 14px; line-height: 1.7; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .card.waiting { border-color: var(--amber); animation: blink 1s ease-in-out infinite; }
  @keyframes blink {
    0%, 100% { border-color: var(--amber); }
    50% { border-color: transparent; }
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .dir { font-weight: 700; font-size: 15px; flex: 1; word-break: break-all; }
  .pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .pill.working { background: #12324b; color: var(--blue); }
  .pill.waiting { background: #3d2e0a; color: var(--amber); }
  .pill.input { background: #3d2e0a; color: var(--amber); }
  .pill.idle { background: #12351c; color: var(--green); }
  .pill.ended { background: #2d333b; color: var(--dim); }
  .meta { color: var(--dim); font-size: 12px; margin-top: 6px; line-height: 1.6; word-break: break-all; }

  .perm {
    background: var(--card2); border: 1px solid var(--amber); border-radius: 10px;
    padding: 12px; margin-top: 10px;
  }
  .perm .tool { font-weight: 700; font-size: 14px; color: var(--amber); }
  .perm pre {
    font: 12px/1.5 ui-monospace, 'SF Mono', Menlo, monospace;
    white-space: pre-wrap; word-break: break-all; color: var(--text);
    margin-top: 8px; max-height: 180px; overflow-y: auto;
  }
  .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  button {
    border: 0; border-radius: 10px; padding: 15px 4px; font-size: 15px; font-weight: 700;
    color: #fff; touch-action: manipulation;
  }
  button:active { filter: brightness(1.3); }
  .b-yes { background: #1f6feb; }
  .b-always { background: #238636; }
  .b-no { background: #b62324; }
  .b-skip { background: transparent; color: var(--dim); font-size: 12px; font-weight: 400; padding: 8px; grid-column: 1 / -1; }

  .dial { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .dial button { background: var(--card2); border: 1px solid var(--line); color: var(--text); font-size: 13px; font-weight: 500; padding: 11px 4px; }

  footer { color: var(--dim); font-size: 11px; text-align: center; padding: 10px 0 4px; }
</style>
</head>
<body>
<header>
  <h1>Claude Controller</h1>
  <span id="conn">연결 안 됨</span>
</header>
<main id="app"><div class="empty">데몬 연결 대기 중…</div></main>
<footer id="foot"></footer>

<script>
const app = document.getElementById('app');
const conn = document.getElementById('conn');
let state = { sessions: [] };

// ---------- WebSocket ----------
let ws, retryMs = 1000;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { retryMs = 1000; conn.textContent = '연결됨'; conn.classList.add('on'); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') { state = msg; render(); }
  };
  ws.onclose = () => {
    conn.textContent = '연결 안 됨'; conn.classList.remove('on');
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 15000);
  };
}
connect();

// ---------- Wake Lock ----------
let wakeLock = null;
async function acquireWakeLock() {
  try {
    wakeLock = await navigator.wakeLock?.request('screen');
    wakeLock?.addEventListener('release', () => { wakeLock = null; });
  } catch {}
}
acquireWakeLock();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') acquireWakeLock();
});
document.addEventListener('click', () => { if (!wakeLock) acquireWakeLock(); }, { passive: true });

// ---------- API ----------
async function post(path, body) {
  try {
    await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch {}
}
window.respond = (id, decision) => { if (decision === 'deny' && !confirm('이 요청을 거부할까요?')) return; post('/api/respond', { id, decision }); };
window.action = (action, sessionId) => post('/api/action', { action, sessionId });

// ---------- 렌더링 ----------
const STATUS_KO = { working: '작업 중', waiting: '허가 대기', input: '입력 대기', idle: '완료', ended: '종료됨' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function inputSummary(p) {
  const i = p.toolInput || {};
  if (i.command) return i.command;
  if (i.file_path) return i.file_path;
  if (i.url) return i.url;
  if (p.permissionType) return p.permissionType;
  return Object.keys(i).length ? JSON.stringify(i, null, 1) : '';
}

function ago(ts, now) {
  const s = Math.max(0, Math.round((now - ts) / 1000));
  if (s < 60) return s + '초';
  if (s < 3600) return Math.round(s / 60) + '분';
  return Math.round(s / 3600) + '시간';
}

function render() {
  const { sessions, now } = state;
  const anyWaiting = sessions.some((s) => s.pending.length > 0);
  document.body.classList.toggle('alert', anyWaiting);
  if (navigator.vibrate && anyWaiting && !render.vibed) { navigator.vibrate([120, 60, 120]); render.vibed = true; }
  if (!anyWaiting) render.vibed = false;

  if (sessions.length === 0) {
    app.innerHTML = '<div class="empty">활성 Claude Code 세션이 없습니다.<br>맥에서 tmux 안에 <b>claude</b>를 실행하세요.</div>';
    return;
  }

  app.innerHTML = sessions.map((s) => {
    const dir = s.cwd ? s.cwd.split('/').filter(Boolean).pop() : s.id.slice(0, 8);
    const pending = s.pending.map((p) => `
      <div class="perm">
        <div class="tool">🔐 ${esc(p.toolName)} <span style="color:var(--dim);font-weight:400">· ${ago(p.createdAt, now)} 전</span></div>
        <pre>${esc(inputSummary(p))}</pre>
        <div class="btns">
          <button class="b-yes" onclick="respond('${p.id}','once')">예</button>
          <button class="b-always" onclick="respond('${p.id}','always')">항상 예</button>
          <button class="b-no" onclick="respond('${p.id}','deny')">아니오</button>
          <button class="b-skip" onclick="respond('${p.id}','passthrough')">터미널에서 직접 응답</button>
        </div>
      </div>`).join('');

    const dial = s.hasTmux && s.status !== 'ended' ? `
      <div class="dial">
        <button onclick="action('thinking_down','${s.id}')">🧠 생각 ↓</button>
        <button onclick="action('thinking_up','${s.id}')">🧠 생각 ↑</button>
        <button onclick="action('model_cycle','${s.id}')">🔁 모델</button>
      </div>` : '';

    return `
      <section class="card ${s.pending.length ? 'waiting' : ''}">
        <div class="row">
          <span class="dir">${esc(dir)}</span>
          <span class="pill ${s.status}">${STATUS_KO[s.status] ?? s.status}</span>
        </div>
        <div class="meta">
          ${esc(s.cwd ?? '')}<br>
          모델: ${esc(s.model ?? '—')} · 생각: ${s.thinking === null ? '—' : s.thinking ? 'ON' : 'OFF'}
          · 활동 ${ago(s.updatedAt, now)} 전
          ${s.lastMessage ? '<br>💬 ' + esc(s.lastMessage) : ''}
        </div>
        ${pending}${dial}
      </section>`;
  }).join('');

  document.getElementById('foot').textContent =
    `세션 ${sessions.length}개 · 매크로패드: 1 예 / 2 항상 예 / 3 아니오 / 노브 생각·모델`;
}

// 경과 시간 표시 갱신
setInterval(() => { if (state.sessions.length) { state.now = Date.now(); render(); } }, 10000);
</script>
</body>
</html>
