<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262624">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Claude Controller</title>
<style>
  /* claude.ai 다크 톤: 웜 그레이 배경 + 코랄 포인트, 장식 최소화 */
  :root {
    --bg: #262624; --card: #30302e; --line: #3f3d38;
    --text: #f0eee6; --dim: #a6a39a; --accent: #d97757;
    --green: #7fa885; --red: #c46060;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: -apple-system, 'Apple SD Gothic Neo', Roboto, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }
  /* 허가 대기 중: 배경 전체가 코랄 톤으로 깜빡 — 멀리서도 보이게 */
  body.alert { animation: bgblink 1.2s ease-in-out infinite; }
  @keyframes bgblink {
    0%, 100% { background: var(--bg); }
    50% { background: #5c3423; }
  }

  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 28px; }
  h1 { font-family: ui-serif, Georgia, serif; font-size: 22px; font-weight: 500; flex: 1; }
  #conn { width: 8px; height: 8px; border-radius: 50%; background: var(--red); align-self: center; }
  #conn.on { background: var(--green); }

  .empty { color: var(--dim); text-align: center; padding: 80px 0; font-size: 15px; line-height: 1.8; }

  /* 허가 요청 — 화면의 주인공 */
  .ask {
    background: var(--card); border: 1px solid var(--accent); border-radius: 16px;
    padding: 20px; margin-bottom: 16px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(217, 119, 87, 0); }
    50% { box-shadow: 0 0 0 5px rgba(217, 119, 87, .25); }
  }
  .ask .proj { color: var(--dim); font-size: 13px; margin-bottom: 6px; }
  .ask .q { font-family: ui-serif, Georgia, serif; font-size: 19px; margin-bottom: 14px; }
  .ask pre {
    font: 13px/1.6 ui-monospace, 'SF Mono', Menlo, monospace;
    color: var(--text); background: var(--bg); border-radius: 10px;
    padding: 12px 14px; white-space: pre-wrap; word-break: break-all;
    max-height: 160px; overflow-y: auto; margin-bottom: 16px;
  }
  .ask button {
    display: block; width: 100%; border-radius: 12px; padding: 15px;
    font-size: 16px; font-weight: 600; margin-top: 10px; touch-action: manipulation;
    border: 1px solid transparent; background: none; color: var(--text);
  }
  .ask button:active { filter: brightness(1.25); }
  .b-yes { background: var(--accent) !important; color: #fff !important; }
  .b-always { border-color: var(--line) !important; }
  .b-no { color: var(--red) !important; }
  .b-skip {
    color: var(--dim) !important; font-size: 13px !important;
    font-weight: 400 !important; padding: 8px !important;
  }

  /* 세션 목록 — 한 줄씩 */
  .session {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 4px; border-bottom: 1px solid var(--line);
  }
  .session .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.working { background: var(--green); }
  .dot.waiting { background: var(--accent); animation: blink 1s infinite; }
  .dot.input { background: var(--accent); }
  .dot.idle { background: var(--dim); }
  .dot.ended { background: var(--line); }
  @keyframes blink { 50% { opacity: .2; } }
  .session .name { flex: 1; font-size: 15px; font-weight: 500; word-break: break-all; }
  .session .st { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Claude Controller</h1>
  <div id="conn"></div>
</header>
<main id="app"><div class="empty">데몬 연결 대기 중…</div></main>

<script>
const app = document.getElementById('app');
const conn = document.getElementById('conn');
let state = { sessions: [] };

// WebSocket (자동 재접속)
let retryMs = 1000;
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { retryMs = 1000; conn.classList.add('on'); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') { state = msg; render(); }
  };
  ws.onclose = () => {
    conn.classList.remove('on');
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 15000);
  };
}
connect();

// Wake Lock — 화면 꺼짐 방지
let wakeLock = null;
async function acquireWakeLock() {
  try {
    wakeLock = await navigator.wakeLock?.request('screen');
    wakeLock?.addEventListener('release', () => { wakeLock = null; });
  } catch {}
}
acquireWakeLock();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') acquireWakeLock();
});
document.addEventListener('click', () => { if (!wakeLock) acquireWakeLock(); }, { passive: true });

window.respond = (id, decision) =>
  fetch('/api/respond', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, decision }),
  }).catch(() => {});

const STATUS_KO = { working: '작업 중', waiting: '허가 대기', input: '입력 대기', idle: '완료', ended: '종료됨' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const projName = (s) => s.cwd ? s.cwd.split('/').filter(Boolean).pop() : s.id.slice(0, 8);

function question(p) {
  if (p.toolName === 'Bash') return '이 명령을 실행할까요?';
  if (['Edit', 'Write', 'NotebookEdit'].includes(p.toolName)) return '파일을 수정할까요?';
  if (p.toolName === 'Read') return '파일을 읽을까요?';
  if (p.toolName === 'WebFetch') return '이 주소를 가져올까요?';
  return `${p.toolName} 사용을 허용할까요?`;
}

function detail(p) {
  const i = p.toolInput || {};
  return i.command ?? i.file_path ?? i.url ?? p.permissionType
    ?? (Object.keys(i).length ? JSON.stringify(i, null, 1) : '');
}

function render() {
  const { sessions } = state;
  const pending = sessions.flatMap((s) => s.pending.map((p) => ({ ...p, session: s })));

  document.body.classList.toggle('alert', pending.length > 0);
  if (navigator.vibrate && pending.length && !render.vibed) { navigator.vibrate([120, 60, 120]); render.vibed = true; }
  if (!pending.length) render.vibed = false;

  if (!sessions.length) {
    app.innerHTML = '<div class="empty">활성 세션이 없습니다.<br>맥에서 tmux 안에 claude를 실행하세요.</div>';
    return;
  }

  const asks = pending.map((p) => `
    <div class="ask">
      <div class="proj">${esc(projName(p.session))}</div>
      <div class="q">${question(p)}</div>
      <pre>${esc(detail(p))}</pre>
      <button class="b-yes" onclick="respond('${p.id}','once')">예</button>
      <button class="b-always" onclick="respond('${p.id}','always')">예, 다시 묻지 않기</button>
      <button class="b-no" onclick="respond('${p.id}','deny')">아니오</button>
      <button class="b-skip" onclick="respond('${p.id}','passthrough')">터미널에서 응답할게요</button>
    </div>`).join('');

  const list = sessions.map((s) => `
    <div class="session">
      <div class="dot ${s.status}"></div>
      <div class="name">${esc(projName(s))}</div>
      <div class="st">${STATUS_KO[s.status] ?? s.status}</div>
    </div>`).join('');

  app.innerHTML = asks + list;
}
</script>
</body>
</html>
